<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000} .mmp-3d{width:100%;height:100%;display:block}</style></head>
<body><script type="module">
import '@fontsource/lilita-one/400.css'; import '@fontsource/sniglet/800.css';
import { Stage } from '/src/mimic/stage.js';
import { fontsReady } from '/src/mimic/logo.js';
import { PRESETS } from '/src/mimic/avatar.js';
await fontsReady();
const st = new Stage(); document.body.append(st.canvas); st.resize(); st.start();
window.st = st; window.PRESETS = PRESETS; window.V = (x, y, z) => ({ x, y, z });
window.cam = (p, l, fov = 46) => { st.cam = { pos: st.camera.position.clone().set(...p), look: st.camera.position.clone().set(...l), fov }; st.tween = null; };
window.ready = true;
</script></body></html>
