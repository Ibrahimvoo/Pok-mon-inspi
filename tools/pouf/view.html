<!doctype html>
<html><head><meta charset="utf-8"><title>Pouf view</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Development viewer for the course scenery (npm run dev → /tools/pouf/view.html?s=120&cam=behind).
import '@fontsource/luckiest-guy/latin-400.css';
import * as THREE from 'three';
import { buildTrack } from '/src/games/pouf/sim/track.js';
import { COURSES } from '/src/games/pouf/maps/index.js';
import { buildWorld } from '/src/games/pouf/view/world.js';
import { createTraps, createRaft } from '/src/games/pouf/view/props.js';
import { createStage } from '/src/games/pouf/view/stage.js';
import { createCharacter, defaultLook, SPECIES } from '/src/games/pouf/view/characters.js';
import { createFx } from '/src/games/pouf/view/fx.js';
const q = new URLSearchParams(location.search);
await document.fonts.load('80px "Luckiest Guy"');
const course = COURSES[0], T = buildTrack(course);
const stage = createStage(document.getElementById('c'));
stage.setTheme(course.theme);
const world = buildWorld(T, course); stage.scene.add(world.root);
const traps = createTraps(T, course); stage.scene.add(traps.root);
const raft = createRaft(); stage.scene.add(raft.root);
const fx = createFx(stage.scene);
const s = +(q.get('s') || 14), t = +(q.get('t') || 1.3), o = T.at(s);
raft.root.position.set(o.x, o.y, o.z); raft.root.rotation.y = -o.a + .3;
const chars = [0, 1, 2, 3].map(i => { const c = createCharacter(q.get('species') ? { ...defaultLook(i), species: q.get('species') } : defaultLook(i)); const a = i * Math.PI / 2 + .3; c.root.position.set(Math.cos(a) * 1.55, .32, Math.sin(a) * 1.55); c.root.rotation.y = -a - Math.PI / 2; raft.body.add(c.root); return c; });
world.update(t); traps.update(t);
chars.forEach((c, i) => c.update(.016, { mode: 'raft', puff: i === 1 }));
stage.scene.updateMatrixWorld(true);
const butt = chars[1].butt(), dir = butt.clone().sub(raft.root.position).setY(0).normalize();
for (let k = 0; k < 6; k++) { fx.puff(butt, dir, ['#c4ef3f', '#e2fb7a'], 1.2); fx.update(.06); }
for (let k = 0; k < 5; k++) fx.ring(o.x - o.tx * k * 1.6, o.y, o.z - o.tz * k * 1.6, 2.6, 2, .7 - k * .1);
fx.update(.2);
const cam = q.get('cam') || 'behind';
const dist = +(q.get('d') || 11), hgt = +(q.get('h') || 6.5);
if (cam === 'behind') stage.camera.position.set(o.x - o.tx * dist, o.y + hgt, o.z - o.tz * dist);
else if (cam === 'top') stage.camera.position.set(o.x + 1, o.y + 120, o.z + 1);
else if (cam === 'side') stage.camera.position.set(o.x + o.nx * 14 - o.tx * 4, o.y + 7, o.z + o.nz * 14 - o.tz * 4);
const look = T.at(Math.min(T.length, s + (cam === 'behind' ? 6 : 0)));
stage.camera.lookAt(look.x, look.y + 1, look.z);
stage.focus(o.x, o.y, o.z);
stage.resize(innerWidth, innerHeight);
stage.render();
window.ready = true;
</script></body></html>
