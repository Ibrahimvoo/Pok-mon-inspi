<!doctype html>
<html><head><meta charset="utf-8"><title>Pouf art</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Renders the console visuals of Pouf Party (hero, thumbnail, screenshots, depth map) with the game engine.
import '@fontsource/luckiest-guy/latin-400.css';
import * as THREE from 'three';
import { buildTrack } from '/src/games/pouf/sim/track.js';
import { LAGON as course } from '/src/games/pouf/maps/lagon.js';
import { buildWorld } from '/src/games/pouf/view/world.js';
import { createTraps, createRaft } from '/src/games/pouf/view/props.js';
import { createStage } from '/src/games/pouf/view/stage.js';
import { createCharacter } from '/src/games/pouf/view/characters.js';
import { createFx } from '/src/games/pouf/view/fx.js';
await document.fonts.load('80px "Luckiest Guy"');
const T = buildTrack(course);
const canvas = document.getElementById('c');
const stage = createStage(canvas, {});
stage.pixelRatio = 1;
stage.renderer.setPixelRatio(1);
stage.setTheme(course.theme);
const world = buildWorld(T, course); stage.scene.add(world.root);
const traps = createTraps(T, course); stage.scene.add(traps.root);
const raft = createRaft(); stage.scene.add(raft.root);
const fx = createFx(stage.scene); stage.scene.add(fx.shadow);
const looks = [
  { species: 'capy', color: '#e0975a', hat: 'none', extra: 'none', gas: 'green' },
  { species: 'walrus', color: '#5d8fd0', hat: 'cap', extra: 'none', gas: 'green' },
  { species: 'hippo', color: '#8a8f9c', hat: 'none', extra: 'shades', gas: 'green' },
  { species: 'frog', color: '#7cc94a', hat: 'party', extra: 'none', gas: 'green' },
];
const chars = looks.map((l, i) => { const c = createCharacter(l); raft.body.add(c.root); return c; });
const o = {};
const depthMat = new THREE.ShaderMaterial({ vertexShader: '#include <common>\n#include <skinning_pars_vertex>\nvarying float vZ; void main(){ vec3 transformed = position;\n#ifdef USE_INSTANCING\n vec4 mv = modelViewMatrix * instanceMatrix * vec4(transformed,1.);\n#else\n vec4 mv = modelViewMatrix * vec4(transformed,1.);\n#endif\n vZ = -mv.z; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'varying float vZ; void main(){ float d = 1. - smoothstep(4., 90., vZ); gl_FragColor = vec4(vec3(pow(d, 1.3)), 1.); }' });

window.render = ({ s, d = 0, yaw = .25, t = 1.3, cam, look, w, h, puff = [1, 3], seats = [0, 1, 2, 3], depth = false, rings = true, fov = 50 }) => {
  canvas.width = w; canvas.height = h;
  stage.renderer.setSize(w, h, false);
  stage.camera.aspect = w / h; stage.camera.fov = fov; stage.camera.updateProjectionMatrix();
  T.world(s, d, o);
  raft.root.position.set(o.wx, o.y + .02, o.wz); raft.root.rotation.y = -(o.a + yaw);
  raft.body.rotation.set(.04, 0, -.03);
  chars.forEach((c, i) => { const a = Math.PI / 2 + seats[i] * Math.PI / 2 + .25; c.root.position.set(Math.cos(a) * 1.58, .3, Math.sin(a) * 1.58); c.root.rotation.set(0, -a - Math.PI / 2, 0); });
  world.update(t); traps.update(t);
  fx.clear();
  chars.forEach((c, i) => c.update(.016, { mode: 'raft', puff: puff.includes(i) }));
  stage.scene.updateMatrixWorld(true);
  for (const i of puff) {
    const c = chars[i], b = c.butt(), dir = b.clone().sub(raft.root.position).setY(0).normalize();
    for (let k = 0; k < 7; k++) { fx.puff(b, dir, ['#c4ef3f', '#e2fb7a'], 1.1); fx.update(.075); }
  }
  if (rings) { const f = T.at(s); for (let k = 1; k < 6; k++) fx.ring(o.wx - f.tx * k * 2, o.y, o.wz - f.tz * k * 2, 3.1, 2.4, .7 - k * .08); fx.update(.25); }
  fx.shadow.position.set(o.wx, o.y + .03, o.wz); fx.shadow.scale.setScalar(2.5);
  // camera: offsets in the raft's track frame (back, side, up)
  const f = T.at(s);
  const [back, side, up] = cam;
  stage.camera.position.set(o.wx - f.tx * back + f.nx * side, o.y + up, o.wz - f.tz * back + f.nz * side);
  const [la, ls, lu] = look || [6, 0, 1];
  stage.camera.lookAt(o.wx + f.tx * la + f.nx * ls, o.y + lu, o.wz + f.tz * la + f.nz * ls);
  stage.focus(o.wx, o.y, o.wz);
  stage.scene.overrideMaterial = depth ? depthMat : null;
  const bgc = stage.scene.background; if (depth) stage.scene.background = new THREE.Color('#000');
  stage.render();
  stage.scene.overrideMaterial = null; stage.scene.background = bgc;
  return canvas.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
