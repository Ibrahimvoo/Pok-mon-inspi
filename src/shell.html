<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0a18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixémon Éclipse</title>
<style>
/* Console portable Pixémon Éclipse. Portrait : console à clapet (écran en haut, commandes en bas).
   Paysage et ordinateur : console horizontale (croix à gauche, écran au centre, A/B à droite).
   Toucher le logo sous l'écran change la couleur de la coque. */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;
 padding:max(10px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
 background:radial-gradient(120% 80% at 50% -10%,#2c2354 0%,#161129 50%,#0a0812 100%) #0d0a18;color:#efeafc;font:600 12px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer}
button:focus{outline:none}button:focus-visible{outline:2px solid #f6c445;outline-offset:2px}

.console{--hi:#8c7ade;--mid:#6150b2;--lo:#3e3082;--edge:#281e5c;--lbl:#e2dbff;--lbl2:rgba(16,6,44,.4);
 --abm:#e2476d;--abh:#ff9cb4;--abl:#9e2348;--abe:#651131;--abt:rgba(255,255,255,.9);
 --u:clamp(40px,11.6vw,54px);--plastic:radial-gradient(130% 70% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(160deg,var(--hi) 0%,var(--mid) 38%,var(--lo) 100%);
 --relief:inset 0 2px 1px rgba(255,255,255,.42),inset 0 -3px 2px rgba(0,0,0,.22),inset 3px 0 2px rgba(255,255,255,.08),inset -3px 0 2px rgba(0,0,0,.12);
 position:relative;width:min(100%,560px);display:flex;flex-direction:column;filter:drop-shadow(0 22px 30px rgba(0,0,0,.55))}
.console[data-theme=braise]{--hi:#ff9378;--mid:#d9473b;--lo:#9a2626;--edge:#621617;--lbl:#ffe5df;--abm:#36314a;--abh:#6c6585;--abl:#1a1724;--abe:#0d0b12;--abt:#ffd9d2}
.console[data-theme=maree]{--hi:#86e4ee;--mid:#2aa3bd;--lo:#176f8b;--edge:#0c465d;--lbl:#e8fcff;--lbl2:rgba(0,30,45,.4);--abm:#f6c445;--abh:#fff2ad;--abl:#c58c14;--abe:#7a5405;--abt:#5c3c00}
.console[data-theme=aube]{--hi:#fffdf7;--mid:#ebe3d3;--lo:#c6b9a2;--edge:#958873;--lbl:#6a5f4f;--lbl2:rgba(255,255,255,.5);--abm:#6f5bd0;--abh:#b3a5f6;--abl:#45379a;--abe:#2a2063;--abt:#f6f2ff}
.console[data-theme=nuit]{--hi:#55506e;--mid:#2d2a3c;--lo:#17151f;--edge:#09080d;--lbl:#c8c1e3;--abm:#e2476d;--abh:#ff9cb4;--abl:#9e2348;--abe:#4a0c24}

/* ---- couvercle : écran ---- */
.lid{position:relative;z-index:2;padding:12px 10px 8px;border-radius:30px 30px 18px 18px;background:var(--plastic);box-shadow:var(--relief),0 5px 0 var(--edge)}
.bezel{position:relative;padding:6px 8px 9px;border-radius:14px 14px 28px 14px;background:linear-gradient(180deg,#2d2647,#1a1529 60%,#14101e);
 box-shadow:inset 0 2px 6px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.3)}
.strip{display:flex;align-items:center;gap:7px;height:13px;margin:0 0 7px;font:800 7px/1 system-ui,sans-serif;letter-spacing:.2em;color:#a89fcc;white-space:nowrap;overflow:hidden}
.strip i{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#e2476d,#f6c445)}
.strip i:last-child{flex:.3;background:linear-gradient(90deg,#f6c445,#6fd3e0)}
.led{flex:none;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd6d6,#ff3d57 55%,#7a0f20);box-shadow:0 0 7px 2px rgba(255,61,87,.55);animation:led 4s ease-in-out infinite}
@keyframes led{50%{box-shadow:0 0 4px 1px rgba(255,61,87,.35)}}
.screen{position:relative;border-radius:4px;overflow:hidden;background:#000;box-shadow:0 0 0 2px #08060d,0 0 0 3px rgba(255,255,255,.07)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 24%,rgba(255,255,255,0) 42%)}
#c{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;background:#000;outline:none;cursor:pointer;touch-action:none}
.logo{display:flex;align-items:center;justify-content:center;gap:.42em;width:100%;margin:8px 0 0;padding:3px 0;border:0;background:none;color:var(--lbl);
 font:italic 900 clamp(15px,4.4vw,19px)/1.3 "Avenir Next","Arial Black","Segoe UI Black",system-ui,sans-serif;letter-spacing:.01em;text-shadow:0 1px 0 var(--lbl2);touch-action:manipulation}
.logo b{font-weight:900;letter-spacing:.05em;background:linear-gradient(90deg,#ffd75a,#ff9a3d 55%,#ff5f7a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.ecl{flex:none;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 64% 42%,#1c1631 0 46%,transparent 48%),radial-gradient(circle at 40% 40%,#fff3ad,#ffc03d 55%,#ff7a2e);box-shadow:0 0 .55em rgba(255,170,60,.7)}

/* ---- charnière ---- */
.hinge{position:relative;z-index:1;height:18px;margin:0 16px;border-radius:9px;background:linear-gradient(180deg,var(--edge),var(--lo) 18%,var(--hi) 42%,var(--mid) 62%,var(--lo) 86%,var(--edge));box-shadow:0 3px 4px rgba(0,0,0,.35)}

/* ---- base : commandes ---- */
.base{position:relative;z-index:0;padding:16px 14px 18px;border-radius:18px 18px 46px 46px;background:var(--plastic);box-shadow:var(--relief),0 6px 0 var(--edge);
 display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dp . ab" "mid mid mid";align-items:center;row-gap:2px}
.well{grid-area:dp;padding:calc(var(--u)*.17);border-radius:50%;background:radial-gradient(circle,rgba(8,2,30,.26) 0 63%,rgba(8,2,30,.09) 67%,rgba(8,2,30,0) 71%)}
.dp{display:grid;grid-template-columns:repeat(3,var(--u));grid-template-rows:repeat(3,var(--u));grid-template-areas:". u ." "l c r" ". d .";
 filter:drop-shadow(0 4px 0 #0c0a14) drop-shadow(0 7px 6px rgba(0,0,0,.35));touch-action:none;transition:transform .06s}
.dp button,.dp .c{position:relative;border:0;padding:0;margin:0}
.dp .u{grid-area:u;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#463d60,#29233b)}
.dp .d{grid-area:d;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#241f34,#191526)}
.dp .l{grid-area:l;border-radius:10px 0 0 10px;background:linear-gradient(90deg,#403858,#29233b)}
.dp .r{grid-area:r;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#29233b,#1d1a2b)}
.dp .c{grid-area:c;background:#29233b}
.dp .c::after{content:"";position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 45% 40%,#15111f,#2e2843);box-shadow:inset 0 2px 3px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.08)}
.dp button::after{content:"";position:absolute;left:34%;top:34%;width:32%;height:28%;background:#655b85;clip-path:polygon(50% 0,100% 100%,0 100%)}
.dp .d::after{transform:rotate(180deg)}.dp .l::after{transform:rotate(-90deg)}.dp .r::after{transform:rotate(90deg)}
.dp button.on{background:linear-gradient(160deg,#1b1727,#141120)}
.dp button.on::after{background:#f6c445;filter:drop-shadow(0 0 4px rgba(246,196,69,.9))}
.dp:has(.u.on){transform:perspective(260px) rotateX(9deg)}.dp:has(.d.on){transform:perspective(260px) rotateX(-9deg)}
.dp:has(.l.on){transform:perspective(260px) rotateY(-9deg)}.dp:has(.r.on){transform:perspective(260px) rotateY(9deg)}
.ab{grid-area:ab;position:relative;width:calc(var(--u)*2.95);height:calc(var(--u)*2.55)}
.ab::before{content:"";position:absolute;left:50%;top:45%;width:calc(var(--u)*3.2);height:calc(var(--u)*1.58);transform:translate(-50%,-50%) rotate(-28deg);border-radius:999px;
 background:rgba(8,2,30,.22);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.2)}
.key{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}
.kb{left:0;bottom:0}.ka{right:0;top:0}
.key button{width:calc(var(--u)*1.34);height:calc(var(--u)*1.34);border:0;padding:0;border-radius:50%;font:900 calc(var(--u)*.42)/1 system-ui,sans-serif;color:var(--abt);
 background:radial-gradient(circle at 34% 28%,var(--abh) 0,var(--abm) 42%,var(--abl) 100%);text-shadow:0 -1px 0 rgba(0,0,0,.3);
 box-shadow:0 calc(var(--u)*.09) 0 var(--abe),0 calc(var(--u)*.16) calc(var(--u)*.2) rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.25);transition:transform .05s,box-shadow .05s}
.key button.on{transform:translateY(calc(var(--u)*.07));box-shadow:0 calc(var(--u)*.02) 0 var(--abe),0 2px 4px rgba(0,0,0,.35),inset 0 2px 6px rgba(0,0,0,.35)}
.key span,.mid span{font:800 8px/1 system-ui,sans-serif;letter-spacing:.2em;color:var(--lbl);text-shadow:0 1px 0 var(--lbl2)}
.mid{grid-area:mid;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.st{position:relative;width:76px;height:36px;border:0;padding:0;background:none}
.st::before{content:"";position:absolute;left:13px;right:13px;top:12px;height:12px;border-radius:999px;background:linear-gradient(180deg,#4d4469,#2a2340);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 2px 0 rgba(0,0,0,.45),0 0 0 3px rgba(8,2,30,.18);transform:rotate(-25deg)}
.st.on::before{background:linear-gradient(180deg,#2a2340,#1c172c);box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 0 0 3px rgba(8,2,30,.18);transform:rotate(-25deg) translateY(1px)}
.grille{position:absolute;right:calc(var(--u)*.55);bottom:calc(var(--u)*.45);display:flex;gap:calc(var(--u)*.11);transform:rotate(-28deg);pointer-events:none}
.grille i{width:calc(var(--u)*.1);height:calc(var(--u)*.72);border-radius:99px;background:rgba(8,2,30,.45);box-shadow:inset 0 2px 2px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.2)}

#help{display:none;color:#9f97c6;font:600 12px/1.9 system-ui,sans-serif;text-align:center}
#help b{display:inline-block;min-width:1.7em;padding:0 6px;margin:0 2px;border-radius:5px;background:linear-gradient(#3b3458,#28223e);color:#f2edff;font-weight:700;box-shadow:0 2px 0 #110d1f,inset 0 1px 0 rgba(255,255,255,.15)}
@media (pointer:fine){#help{display:block}}

/* ---- paysage et ordinateur : console horizontale ---- */
@media (orientation:landscape){
 body{gap:10px}
 .console{--u:clamp(30px,min(calc((100dvh - 40px)/8.4),calc(100vw/22.5)),58px);--vch:96px;
  --sw:min(960px,calc((100dvh - var(--vch) - env(safe-area-inset-top) - env(safe-area-inset-bottom))*1.5),calc(100vw - var(--u)*8.2 - env(safe-area-inset-left) - env(safe-area-inset-right) - 40px));
  display:grid;grid-template-columns:auto auto auto;grid-template-rows:1fr auto;grid-template-areas:"dp lid ab" "dp lid mid";align-items:center;width:auto;
  column-gap:calc(var(--u)*.42);padding:calc(var(--u)*.3) calc(var(--u)*.55);border-radius:calc(var(--u)*1.7)/calc(var(--u)*2.6);
  background:var(--plastic);box-shadow:var(--relief),0 7px 0 var(--edge)}
 .lid{grid-area:lid;padding:0;background:none;box-shadow:none;border-radius:0}
 .bezel{border-radius:14px 14px 28px 14px}
 .hinge{display:none}
 .base{display:contents}
 #c{width:var(--sw)}
 .well{align-self:center}
 .ab{align-self:end;margin-bottom:calc(var(--u)*.2)}
 .mid{align-self:start;margin-top:calc(var(--u)*.15)}
 .grille{display:none}
}
@media (orientation:landscape) and (pointer:fine){.console{--vch:178px}}
@media (orientation:landscape) and (max-height:500px){.logo{display:none}.strip{height:9px;margin-bottom:5px}.bezel{padding:5px 8px 8px}}
@media (prefers-reduced-motion:reduce){.led{animation:none}.dp,.key button{transition:none}}
</style></head><body>
<main class="console" id="console" data-theme="crepuscule">
 <section class="lid">
  <div class="bezel">
   <div class="strip"><span class="led"></span><i></i><span>ÉCRAN COULEUR · SON STÉRÉO</span><i></i></div>
   <div class="screen"><canvas id="c" width="480" height="320" tabindex="0" aria-label="Écran du jeu"></canvas></div>
  </div>
  <button class="logo" id="logo" type="button" tabindex="-1" title="Changer la couleur de la console"><span class="ecl"></span>Pixémon <b>ÉCLIPSE</b></button>
 </section>
 <div class="hinge"></div>
 <section class="base">
  <div class="well"><div class="dp"><button class="u" data-k="up" tabindex="-1" aria-label="Haut"></button><button class="l" data-k="left" tabindex="-1" aria-label="Gauche"></button><span class="c"></span><button class="r" data-k="right" tabindex="-1" aria-label="Droite"></button><button class="d" data-k="down" tabindex="-1" aria-label="Bas"></button></div></div>
  <div class="ab"><div class="key kb"><button data-k="b" tabindex="-1">B</button><span>RETOUR</span></div><div class="key ka"><button data-k="a" tabindex="-1">A</button><span>VALIDER</span></div></div>
  <div class="mid"><button class="st" data-k="start" tabindex="-1" aria-label="Menu"></button><span>MENU</span></div>
  <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
 </section>
</main>
<div id="help"><b>Flèches</b>/<b>ZQSD</b> bouger · <b>Espace</b> A · <b>Échap</b> B (maintenir : courir) · <b>M</b> menu · souris acceptée · clique sur le logo pour changer la couleur</div>
