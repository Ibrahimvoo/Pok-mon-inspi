<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#02060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Expérience d’interface de console inspirée de la PS5 — concept non officiel, jouable à la manette, au clavier, à la souris et au toucher." />
  <title>Console UI — Concept PS5</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2302060f'/%3E%3Cpath d='M9 11l6 6M15 11l-6 6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='14' r='3.4' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="bg-fallback" aria-hidden="true"><i></i><i></i></div>
  <div id="shade" aria-hidden="true"></div>
  <main id="app"></main>
  <div id="hud">
    <div id="toasts" aria-live="polite"></div>
    <div id="hints"></div>
    <div id="touchbar">
      <button type="button" data-action="back" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" data-action="ps" aria-label="Centre de contrôle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l4 4M11 7l-4 4"/><circle cx="16.5" cy="9" r="2.6"/><path d="M16.5 13.6l2.6 4.4h-5.2z"/><rect x="5" y="13.8" width="4.4" height="4.4" rx=".4"/></svg></button>
    </div>
  </div>
  <div id="rotate"><div><div class="rot-ic"></div><p>Tournez votre appareil en mode paysage pour une meilleure expérience.</p></div></div>
  <noscript><p style="color:#fff;font:16px sans-serif;padding:40px">JavaScript est nécessaire pour cette expérience.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
